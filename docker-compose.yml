# Entorno de desarrollo local completo.
# Un solo `docker compose up -d` deja todo arriba.
# Ver RONDA-PLAN-MAESTRO.md sec. 11.2

name: ronda

services:
  app:
    build:
      context: .
      target: runtime
    image: ronda-app:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: local
      OCTANE_SERVER: frankenphp
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [ronda]
    deploy:
      resources:
        limits: {memory: 1G}

  horizon:
    image: ronda-app:local
    restart: unless-stopped
    env_file: [.env]
    command: php artisan horizon
    volumes:
      - .:/app
    depends_on:
      app: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [ronda]
    deploy:
      resources:
        limits: {memory: 512M}

  scheduler:
    image: ronda-app:local
    restart: unless-stopped
    env_file: [.env]
    command: php artisan schedule:work
    volumes:
      - .:/app
    depends_on:
      app: {condition: service_started}
    networks: [ronda]
    deploy:
      resources:
        limits: {memory: 256M}

  reverb:
    image: ronda-app:local
    restart: unless-stopped
    env_file: [.env]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      app: {condition: service_started}
    networks: [ronda]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ronda_central}
      POSTGRES_USER: ${DB_USERNAME:-ronda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # El tenant se crea con CREATE DATABASE: el usuario necesita createdb.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # 5433 fuera para no chocar con un postgres local.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ronda} -d ${DB_DATABASE:-ronda_central}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ronda]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ronda]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interfaz web
    networks: [ronda]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ronda}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secretsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ronda]

networks:
  ronda:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
